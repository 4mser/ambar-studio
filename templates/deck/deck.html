<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New deck</title>
  <link rel="stylesheet" href="/@ambar/runtime/ambar.css">
  <link rel="stylesheet" href="/@ambar/runtime/slides.css">
</head>
<body>
  <section class="slide">
    <div class="kicker">Kicker</div>
    <h1>A title that <span class="accent">matters</span>.</h1>
    <div class="brand">AMBAR</div><div data-number></div>
  </section>
  <section class="slide">
    <div class="kicker">Second</div>
    <h2>One idea per slide.</h2>
    <p>Arrows or space to move, F for fullscreen.</p>
    <div class="brand">AMBAR</div><div data-number></div>
  </section>
  <script type="module">
    import { deck } from '/@ambar/runtime/slides.js'
    deck()
  </script>
</body>
</html>
