<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMBAR Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23F2A324'/></svg>">
  <link rel="stylesheet" href="/@ambar/runtime/ambar.css">
  <link rel="stylesheet" href="/@ambar/studio/studio.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><i></i>AMBAR <span>Studio</span></div>
    <div class="meta" id="meta">loading…</div>
    <div class="tools">
      <button id="safe" title="Safe areas (S)">Safe areas</button>
      <select id="speed" title="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
        <option value="1" selected>1×</option><option value="2">2×</option>
      </select>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <div class="frame" id="frame">
      <iframe id="comp" title="Composition"></iframe>
      <div class="safe" id="safeAreas"><i class="action"></i><i class="title"></i><i class="thirds"></i></div>
    </div>
  </main>

  <footer class="dock">
    <div class="transport">
      <button id="back" title="Previous frame (←)">◂</button>
      <button id="play" class="play" title="Play / pause (space)">▶</button>
      <button id="next" title="Next frame (→)">▸</button>
      <div class="clock"><b id="time">0.00</b><span id="total">/ 0.00 s</span><em id="frameNo">f 0</em></div>
    </div>
    <div class="track" id="track">
      <div class="cues" id="cues"></div>
      <input id="scrub" type="range" min="0" max="10" step="0.001" value="0">
    </div>
  </footer>

  <audio id="audio" preload="auto"></audio>
  <script type="module" src="/@ambar/studio/studio.js"></script>
</body>
</html>
