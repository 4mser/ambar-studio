<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AMBAR · motion</title>
  <link rel="stylesheet" href="/@ambar/runtime/ambar.css">
  <style>
    #stage { background: var(--night); }
    .orb { position: absolute; left: 140px; top: 260px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(242, 163, 36, .2), transparent 65%); }
    .kicker { position: absolute; left: 72px; top: 150px; font: 600 26px/1 var(--mono); letter-spacing: .14em; color: var(--amber); }
    .title { position: absolute; left: 72px; right: 72px; top: 196px; font-size: 84px; line-height: 1.05; font-weight: 750; letter-spacing: -.02em; }
    .card { position: absolute; left: 72px; top: 440px; width: 936px; height: 660px; padding: 48px; }
    .card svg { width: 840px; height: 380px; display: block; }
    .card h3 { margin-top: 34px; font: 600 48px/1.1 var(--mono); color: var(--honey); }
    .card p { margin-top: 14px; font-size: 32px; color: var(--muted); }
    .window { position: absolute; left: 72px; top: 440px; width: 936px; height: 680px; border-radius: 28px; overflow: hidden; background: rgba(255, 210, 122, .05); border: 1px solid var(--line); }
    .cam { position: absolute; inset: 0; }
    .tile { position: absolute; width: 268px; height: 268px; border-radius: 22px; background: rgba(255, 244, 224, .06); }
    .tile i { position: absolute; left: 28px; right: 28px; height: 18px; border-radius: 9px; background: rgba(255, 244, 224, .14); }
    .tile.detail { background: rgba(242, 163, 36, .16); border: 2px solid var(--amber); }
    .tile.detail b { position: absolute; left: 28px; top: 28px; font-size: 34px; line-height: 1.1; color: var(--cream); }
    .tile.detail i { background: var(--amber); }
    .charts { position: absolute; left: 72px; top: 420px; width: 936px; height: 720px; }
    .charts svg { width: 100%; height: 100%; }
    .pct { position: absolute; left: 640px; top: 520px; width: 240px; text-align: center; font: 700 56px/1 var(--font); }
    .pct small { display: block; margin-top: 10px; font-size: 24px; font-weight: 500; color: var(--muted); }
    .full { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #caps { top: 1200px; height: 130px; align-items: center; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="orb" id="orb"></div>
    <svg class="full" id="dust" viewBox="0 0 1080 1350" data-glow></svg>

    <!-- 1 · settle -->
    <div class="layer" id="s1">
      <div class="kicker" id="k1"></div>
      <div class="title" id="t1"></div>
      <div class="card glass" id="card">
        <svg id="curve" viewBox="0 0 840 380"><line x1="24" x2="816" y1="24" y2="24" stroke="rgba(255,244,224,.25)" stroke-width="2" stroke-dasharray="6 10"/></svg>
        <h3>ease.settle</h3>
        <p>Reaches 1 and stays there.</p>
      </div>
    </div>

    <!-- 2 · camera -->
    <div class="layer" id="s2">
      <div class="kicker" id="k2"></div>
      <div class="title" id="t2"></div>
      <div class="window"><div class="cam" id="cam"></div></div>
    </div>

    <!-- 3 · charts -->
    <div class="layer" id="s3">
      <div class="kicker" id="k3"></div>
      <div class="title" id="t3"></div>
      <div class="charts">
        <svg id="chart" viewBox="0 0 936 720"></svg>
        <div class="pct"><span id="pct"></span><small>on time</small></div>
      </div>
    </div>

    <!-- 4 · shape -->
    <div class="layer" id="s4">
      <div class="kicker" id="k4"></div>
      <div class="title" id="t4"></div>
      <svg class="full" id="swarm" viewBox="0 0 1080 1350"></svg>
    </div>

    <div id="caps"></div>
    <div class="full" id="sweep" data-check="skip"></div>
    <div class="grain" id="grain"></div>
  </div>

  <script type="module" src="./scene.js"></script>
</body>
</html>
