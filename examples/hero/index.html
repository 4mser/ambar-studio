<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AMBAR · hero</title>
  <link rel="stylesheet" href="/@ambar/runtime/ambar.css">
  <style>
    #stage { background: radial-gradient(90% 120% at 22% 50%, #3a1d06 0%, #1b0f05 46%, #0c0703 100%); }
    .glow { position: absolute; border-radius: 50%; filter: blur(60px); }
    #mascot { position: absolute; left: 0; top: 0; width: 1600px; height: 560px; }
    .copy { position: absolute; left: 640px; top: 0; height: 560px; display: flex; flex-direction: column; justify-content: center; }
    .kicker { font: 600 18px var(--mono); letter-spacing: 0.32em; color: var(--amber); text-transform: uppercase; }
    .title { margin-top: 18px; font-size: 128px; font-weight: 850; letter-spacing: -0.05em; line-height: 0.9;
      background: linear-gradient(180deg, #fff4e0 0%, #ffd27a 55%, #f2a324 100%); -webkit-background-clip: text; color: transparent; }
    .title .w { background: inherit; -webkit-background-clip: text; }
    .sub { margin-top: 26px; font-size: 30px; line-height: 1.35; color: var(--muted); max-width: 820px; }
    .sub b { color: var(--cream); font-weight: 650; }
    .ruler { position: absolute; left: 640px; right: 90px; bottom: 58px; height: 34px; }
    .ruler .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255, 210, 122, 0.25) 0 2px, transparent 2px 28px); mask: linear-gradient(transparent 55%, #000 55%); }
    .ruler .head { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--amber); box-shadow: 0 0 18px var(--glow); }
    .ruler .t { position: absolute; top: -30px; font: 600 15px var(--mono); color: var(--honey); transform: translateX(-50%); }
  </style>
</head>
<body>
  <div id="stage">
    <div class="glow" id="g1" style="width:520px;height:520px;left:40px;top:20px;background:rgba(242,163,36,.28)"></div>
    <svg id="mascot" viewBox="0 0 1600 560"><g id="m"></g></svg>
    <div class="copy">
      <div class="kicker" id="kicker">Video · Slides · Documents</div>
      <div class="title" id="title"></div>
      <div class="sub" id="sub">HTML in, <b>MP4, PDF and PNG</b> out.<br>Every frame is a function of time.</div>
    </div>
    <div class="ruler"><div class="ticks"></div><div class="head" id="head"></div><div class="t" id="tc">00:00</div></div>
  </div>

  <script src="/@ambar/mascot/ambar.js"></script>
  <script type="module">
    import { video, letters, rise, fadeUp, ease, progress, keys, mascot, css, $ } from '/@ambar/runtime/ambar.js'

    const LOOP = 6
    let title

    video({
      width: 1600,
      height: 560,
      fps: 30,
      duration: LOOP,
      setup () {
        title = letters($('#title'), 'AMBAR')
      },
      render (t) {
        // A loop: everything is periodic in LOOP, so frame 0 follows the last frame
        const phase = (t / LOOP) * Math.PI * 2

        // ÁMBAR breathes and changes expression through the loop
        const weights = {
          normal: Math.max(0, Math.cos(phase)),
          feliz: Math.max(0, Math.sin(phase)),
          sorprendida: Math.max(0, -Math.sin(phase)) * 0.6,
          pensativa: Math.max(0, -Math.cos(phase)) * 0.8
        }
        const expr = Object.entries(weights).sort((a, b) => b[1] - a[1])[0][0]
        const blink = Math.max(0, 1 - Math.abs(((t + 1.2) % 3) - 0.08) / 0.08)
        $('#m').innerHTML = mascot({
          x: 330, y: 300 + Math.sin(phase) * 6, R: 150, t: phase * 0.9 + 4,
          expr, pesos: weights, mira: [Math.cos(phase) * 0.6, Math.sin(phase * 2) * 0.3],
          parpadeo: blink, chispas: 0.55 + 0.45 * Math.sin(phase * 2)
        })
        css($('#g1'), { transform: `scale(${1 + 0.06 * Math.sin(phase)})`, opacity: 0.85 + 0.15 * Math.cos(phase) })

        // Letters shimmer in place: a gentle wave that loops
        title.forEach((el, i) => {
          const k = Math.sin(phase - i * 0.55)
          css(el, { transform: `translateY(${k * -6}px)`, opacity: 0.88 + 0.12 * k })
        })

        // Timeline ruler: the playhead sweeps once per loop
        const x = progress(t, 0, LOOP)
        css($('#head'), { left: `${x * 100}%` })
        css($('#tc'), { left: `${x * 100}%` })
        $('#tc').textContent = `00:${String(Math.floor(t)).padStart(2, '0')}.${String(Math.floor((t % 1) * 30)).padStart(2, '0')}`
      }
    })
  </script>
</body>
</html>
