<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AMBAR · family</title>
  <link rel="stylesheet" href="/@ambar/runtime/ambar.css">
  <link rel="stylesheet" href="./family.css">
</head>
<body>
  <div id="stage">
    <div class="glow" id="glow-ambar" data-glow></div>
    <div class="glow" id="glow-sol" data-glow></div>
    <div class="glow" id="glow-mint" data-glow></div>

    <div class="head">
      <div class="kicker" id="kicker">Character kit</div>
      <div class="title" id="title"></div>
    </div>

    <svg class="cast" viewBox="0 0 1080 1350"><g id="trails"></g><g id="cast"></g></svg>

    <div class="caption" id="caption"><span class="figure" id="figure"></span><span class="say"><b id="who"></b><span id="line"></span></span></div>
    <div class="code" id="code"><span class="f">character</span>({ palette, lobes, accessory })</div>
    <div class="grain" id="grain"></div>
  </div>

  <script src="/@ambar/mascot/ambar.js"></script>
  <script type="module" src="./scene.js"></script>
</body>
</html>
